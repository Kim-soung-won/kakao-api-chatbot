# self-signed HTTPS 종단 프록시.
#   cert/{cert.pem,key.pem}(mkcert 개발 인증서, SAN=localhost)로 TLS를 끝내고
#   /skill·/echo·/health 를 server 컨테이너(:3000)로 평문 프록시한다.
# 목적: "카카오가 self-signed(사설 CA) 인증서 스킬 URL을 받아주나?" 실측.
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # 스킬 서버로 프록시 (compose 서비스명 server)
  location ~ ^/(skill|echo|health) {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / { return 404; }
}
