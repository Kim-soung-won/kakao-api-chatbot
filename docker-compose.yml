# 스킬 서버 컨테이너 오케스트레이션.
#   pnpm docker:build && pnpm docker:up   (또는 docker compose up -d --build)
# 카카오 키는 apps/server/.env 에서 주입(없으면 생략). 실제 배포 시 호스트 env로 대체.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: sprint-kakao-server
    container_name: sprint-kakao-server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    env_file:
      - path: apps/server/.env
        required: false
    # captured-requests/ 볼륨: (1) /echo 요청 원문 캡처  (2) 대화 이력 저장소
    #   → captured-requests/history/<botUserKey>.json 에 턴별로 적재(RAG 전송 소스).
    #   카카오 output context 왕복이 실측상 동작하지 않아 파일 저장소로 관리(docs/rag-history.md).
    volumes:
      - ./captured-requests:/app/captured-requests
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 선택: 카카오 스킬 URL용 임시 HTTPS 터널(cloudflared quick tunnel).
  #   docker compose --profile tunnel up -d cloudflared
  #   docker compose logs cloudflared   → https://<랜덤>.trycloudflare.com 확인
  # ⚠️ quick tunnel URL은 재시작 시 바뀐다(임시). 운영용 고정 URL은 도메인+named tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sprint-kakao-tunnel
    command: tunnel --no-autoupdate --url http://server:3000
    depends_on:
      - server
    profiles:
      - tunnel
    restart: unless-stopped

  # 선택: self-signed HTTPS 종단 프록시(nginx). cert/{cert.pem,key.pem}으로 TLS를 끝내고
  #   /skill·/echo·/health 를 server:3000 으로 프록시한다.
  #   docker compose --profile https-proxy up -d https-proxy
  #   로컬 확인:  curl -k https://localhost:8443/health   → {"status":"ok"}
  #   카카오 실측(자체 CA 인증서 수용 여부)은 카카오가 우리 TLS에 "직접" 닿아야 하므로
  #   TLS를 종단하지 않는 raw TCP 터널이 필요하다(cloudflared는 엣지에서 자체 유효 인증서로
  #   재종단해 self-signed가 가려짐). bore raw TCP 패스스루로 8443을 노출:
  #     docker run -d --name sprint-kakao-bore --network sprint-kakao_default \
  #       ekzhang/bore:latest local 443 --to bore.pub --local-host https-proxy
  #     → https://bore.pub:<포트>/skill 를 오픈빌더에 등록
  #   ⚠️ 이 cert의 SAN은 localhost 뿐 → bore.pub 호스트명과 불일치. self-signed(사설 CA)
  #      거부와 호스트명 불일치가 함께 걸릴 수 있음(로그로 원인 구분). 상세 docs/https-requirement-test.md.
  https-proxy:
    image: nginx:alpine
    container_name: sprint-kakao-https
    ports:
      - "8443:443"
    volumes:
      - ./docker/https-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert:/etc/nginx/certs:ro
    depends_on:
      - server
    profiles:
      - https-proxy
    restart: unless-stopped

  # 렌더러/빌더 테스트 하니스. nginx 정적 서빙 + /skill·/echo 는 server로 프록시.
  playground:
    build:
      context: .
      dockerfile: apps/playground/Dockerfile
    image: sprint-kakao-playground
    container_name: sprint-kakao-playground
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
